services:
  db:
    image: mysql:8.0
    container_name: foodcourt-db
    restart: always
    environment:
      MYSQL_DATABASE: foodcourt
      MYSQL_ROOT_PASSWORD: "1234"
    ports:
      - "3306:3306"
    volumes:
      - ./pkg/database/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
